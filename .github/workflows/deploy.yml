name: Build And Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build standalone release
        run: npm run build

      - name: Package release
        run: |
          mkdir -p release/.next
          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public
          tar -C release -czf fx-web-release.tgz .

      - name: Upload release archive
        uses: appleboy/scp-action@v1
        with:
          host: 8.145.48.29
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: fx-web-release.tgz,deploy/fx-web.service
          target: /tmp
          overwrite: true

      - name: Replace production service
        uses: appleboy/ssh-action@v1
        with:
          host: 8.145.48.29
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            service=fx-web.service
            target=/opt/fx-web/apps/website/current
            legacy_target=/opt/fx/apps/website/current
            archive=/tmp/fx-web-release.tgz
            unit=/tmp/deploy/fx-web.service

            systemctl status "$service" --no-pager || true
            journalctl -u "$service" -n 200 --no-pager || true

            test -f "$archive"
            test -f "$unit"

            install -d -o fx-web -g fx-web "$target"
            if [ ! -f "$target/.env" ] && [ -f "$legacy_target/.env" ]; then
              mv "$legacy_target/.env" "$target/.env"
              chown fx-web:fx-web "$target/.env"
            fi

            systemctl stop "$service"
            find "$target" -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf -- {} +
            tar -xzf "$archive" -C "$target"
            chown -R fx-web:fx-web "$target"
            rm -f "$archive"

            install -m 0644 "$unit" /etc/systemd/system/fx-web.service
            systemctl daemon-reload
            systemctl restart "$service"
            systemctl is-active --quiet "$service"
            curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused --max-time 15 http://127.0.0.1:3010/ > /dev/null
            journalctl -u "$service" -p warning -n 50 --no-pager
