name: Build And Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build standalone release
        run: npm run build

      - name: Check out enterprise UI
        uses: actions/checkout@v4
        with:
          repository: Xujiuj/enterprise-ui
          ref: main
          path: enterprise-ui

      - name: Build enterprise UI release
        working-directory: enterprise-ui
        run: |
          npm ci
          npm run test:unit
          npm run build:prod

      - name: Package release
        run: |
          mkdir -p release/.next
          cp -R .next/standalone/. release/
          mkdir -p release/.next/static release/public
          cp -R .next/static/. release/.next/static/
          cp -R public/. release/public/
          mkdir -p release/prisma release/scripts
          cp prisma/sqlite-bootstrap.sql release/prisma/
          cp scripts/ensure-sqlite-schema.mjs release/scripts/
          tar -C release -czf fx-web-release.tgz .
          mkdir -p enterprise-ui-release/nginx
          cp -R enterprise-ui/dist/. enterprise-ui-release/
          cp enterprise-ui/nginx/default.conf enterprise-ui-release/nginx/default.conf
          tar -C enterprise-ui-release -czf enterprise-ui-release.tgz .

      - name: Upload release archive
        uses: appleboy/scp-action@v1
        with:
          host: 8.145.48.29
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: fx-web-release.tgz,enterprise-ui-release.tgz,deploy/fx-web.service
          target: /tmp
          overwrite: true

      - name: Replace production service
        uses: appleboy/ssh-action@v1
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        with:
          host: 8.145.48.29
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SMTP_USER,SMTP_PASSWORD,SMTP_FROM
          command_timeout: 10m
          script: |
            set -euo pipefail
            service=fx-web.service
            target=/opt/fx-web/apps/website/current
            legacy_target=/opt/fx/apps/website/current
            data_dir=/opt/fx-web/data
            database="$data_dir/site.db"
            legacy_database="$target/prisma/site.db"
            archive=/tmp/fx-web-release.tgz
            enterprise_archive=/tmp/enterprise-ui-release.tgz
            enterprise_target=/opt/fx-enterprise-ui/current
            enterprise_container=fx-enterprise-ui
            enterprise_port=17001
            enterprise_network=fx-delivery
            nginx_site=/etc/nginx/sites-available/fx-web
            unit=/tmp/deploy/fx-web.service

            systemctl status "$service" --no-pager || true
            journalctl -u "$service" -n 200 --no-pager || true

            test -f "$archive"
            test -f "$enterprise_archive"
            test -f "$unit"

            # Verify the existing enterprise backend before changing its frontend route.
            docker network inspect "$enterprise_network" >/dev/null
            docker inspect enterprise-backend >/dev/null
            docker ps --filter "name=^/${enterprise_container}$" --filter "name=^/enterprise-backend$"
            docker logs --tail 200 enterprise-backend
            docker logs --tail 200 "$enterprise_container" 2>/dev/null || true
            nginx -T 2>&1 | grep -E 'location[[:space:]]+(\^~[[:space:]]+)?/enterprise/prod-api/'
            test -f "$nginx_site"
            grep -F 'server_name fengxingzhicheng.com' "$nginx_site" >/dev/null
            grep -F 'location / {' "$nginx_site" >/dev/null

            install -d -o fx-web -g fx-web "$target"
            if [ ! -f "$target/.env" ] && [ -f "$legacy_target/.env" ]; then
              mv "$legacy_target/.env" "$target/.env"
              chown fx-web:fx-web "$target/.env"
            fi

            : "${SMTP_USER:?Missing SMTP_USER secret}"
            : "${SMTP_PASSWORD:?Missing SMTP_PASSWORD secret}"
            : "${SMTP_FROM:?Missing SMTP_FROM secret}"
            smtp_env=$(mktemp)
            {
              if [ -f "$target/.env" ]; then
                sed -E '/^SMTP_(HOST|PORT|SECURE|USER|PASSWORD|FROM)=/d' "$target/.env"
              fi
              printf '%s\n' 'SMTP_HOST=smtp.qq.com' 'SMTP_PORT=465' 'SMTP_SECURE=true'
              printf 'SMTP_USER=%s\nSMTP_PASSWORD=%s\nSMTP_FROM=%s\n' "$SMTP_USER" "$SMTP_PASSWORD" "$SMTP_FROM"
            } > "$smtp_env"
            install -o fx-web -g fx-web -m 0600 "$smtp_env" "$target/.env"
            rm -f "$smtp_env"

            install -d -o fx-web -g fx-web "$data_dir"
            if [ ! -f "$database" ] && [ -f "$legacy_database" ]; then
              mv "$legacy_database" "$database"
            fi
            systemctl stop "$service"
            find "$target" -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf -- {} +
            tar -xzf "$archive" -C "$target"
            /opt/fx/runtime/node/bin/node --no-warnings "$target/scripts/ensure-sqlite-schema.mjs" "$database" "$target/prisma/sqlite-bootstrap.sql"
            chown -R fx-web:fx-web "$target" "$data_dir"
            rm -f "$archive"

            install -m 0644 "$unit" /etc/systemd/system/fx-web.service
            systemctl daemon-reload
            systemctl restart "$service"
            systemctl is-active --quiet "$service"
            curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused --max-time 15 http://127.0.0.1:3010/ > /dev/null
            journalctl -u "$service" -p warning -n 50 --no-pager

            docker pull nginx:1.27-alpine
            install -d -m 0755 "$enterprise_target"
            docker rm -f "$enterprise_container" 2>/dev/null || true
            find "$enterprise_target" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            tar -xzf "$enterprise_archive" -C "$enterprise_target"
            rm -f "$enterprise_archive"
            docker run --detach \
              --name "$enterprise_container" \
              --network "$enterprise_network" \
              --restart unless-stopped \
              --publish "127.0.0.1:${enterprise_port}:80" \
              --volume "$enterprise_target:/usr/share/nginx/html:ro" \
              --volume "$enterprise_target/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine
            curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused --max-time 15 "http://127.0.0.1:${enterprise_port}/" > /dev/null

            if ! grep -F 'BEGIN FX_ENTERPRISE_UI' "$nginx_site" >/dev/null; then
              nginx_backup=$(mktemp)
              nginx_candidate=$(mktemp)
              cp "$nginx_site" "$nginx_backup"
              sed '/^[[:space:]]*location \/ {/i\
    # BEGIN FX_ENTERPRISE_UI\
    location = /enterprise {\
        return 308 /enterprise/;\
    }\
\
    location ^~ /enterprise/ {\
        proxy_pass http://127.0.0.1:17001/;\
    }\
    # END FX_ENTERPRISE_UI\
' "$nginx_site" > "$nginx_candidate"
              install -m 0644 "$nginx_candidate" "$nginx_site"
              if ! nginx -t; then
                install -m 0644 "$nginx_backup" "$nginx_site"
                nginx -t
                rm -f "$nginx_backup" "$nginx_candidate"
                exit 1
              fi
              rm -f "$nginx_backup" "$nginx_candidate"
            fi
            nginx -s reload
            curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused --max-time 15 https://fengxingzhicheng.com/enterprise/ > /dev/null
            docker logs --tail 100 "$enterprise_container"
