name: Enable SSH Password Authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable password authentication after configuration check
        uses: appleboy/ssh-action@v1
        with:
          host: 8.145.48.29
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            service=ssh
            systemctl is-active --quiet "$service" || service=sshd
            systemctl is-active --quiet "$service"
            sshd -T | grep -E '^(passwordauthentication|kbdinteractiveauthentication|permitrootlogin) '
            grep -R -n -E '^(PasswordAuthentication|PermitRootLogin) ' /etc/ssh/sshd_config /etc/ssh/sshd_config.d 2>/dev/null || true
            journalctl -u "$service" -n 80 --no-pager

            sed -i -E \
              -e 's/^[[:space:]]*PermitRootLogin[[:space:]]+.*/PermitRootLogin yes/' \
              -e 's/^[[:space:]]*PasswordAuthentication[[:space:]]+.*/PasswordAuthentication yes/' \
              /etc/ssh/sshd_config
            rm -f /etc/ssh/sshd_config.d/00-password-auth.conf /etc/ssh/sshd_config.d/99-password-auth.conf
            sshd -t
            systemctl reload "$service"
            sshd -T | grep -E '^(passwordauthentication|permitrootlogin) ' | grep -E '(yes|true)'
