name: Read Contact Mail Delivery Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read recent delivery records
        uses: appleboy/ssh-action@v1
        with:
          host: 8.145.48.29
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            systemctl is-active --quiet fx-web.service
            /opt/fx/runtime/node/bin/node -e '
              const { DatabaseSync } = require("node:sqlite");
              const db = new DatabaseSync("/opt/fx-web/data/site.db", { readOnly: true });
              const rows = db.prepare("SELECT status, recipients, sender, subject, createdAt, sentAt, providerMessageId, error FROM ContactLeadEmailDelivery ORDER BY createdAt DESC LIMIT 20").all();
              console.log(rows.length ? rows.map((row) => JSON.stringify(row)).join("\\n") : "NO_EMAIL_DELIVERY_RECORDS");
              db.close();
            '
