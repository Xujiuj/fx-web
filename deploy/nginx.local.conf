# Public site on a dedicated port. It deliberately does not alter the
# machine's existing port-80 default server.
upstream fx_web_local {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    proxy_hide_header X-Powered-By;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location ^~ /_next/static/ {
        proxy_pass http://fx_web_local;
        # This HTTP-only listener must not inherit the TLS CSP upgrade directive.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none';" always;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /media/optimized/ {
        proxy_pass http://fx_web_local;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none';" always;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # BEGIN FX_MANAGED_MEDIA
    location ^~ /media/uploads/ {
        alias /opt/fx-web/data/media/uploads/;
    }

    location ^~ /media/documents/ {
        alias /opt/fx-web/data/media/documents/;
    }

    location ^~ /media/videos/ {
        alias /opt/fx-web/data/media/videos/;
    }
    # END FX_MANAGED_MEDIA

    # Match production upload behavior without relaxing limits site-wide.
    location ^~ /api/admin/media {
        client_max_body_size 2049m;
        proxy_request_buffering off;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
        proxy_pass http://fx_web_local;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none';" always;
    }

    location / {
        proxy_pass http://fx_web_local;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none';" always;
    }
}
