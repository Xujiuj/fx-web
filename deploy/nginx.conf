# Install as /etc/nginx/sites-available/fx-web and enable it from
# /etc/nginx/sites-enabled. This file is included from nginx's http context.

upstream fx_web {
    server 127.0.0.1:3010;
    keepalive 32;
}

# This must be the only default HTTP server so requests sent to the server IP
# are also normalized to the public hostname.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fengxingzhicheng.com www.fengxingzhicheng.com 8.145.48.29;

    return 308 https://fengxingzhicheng.com$request_uri;
}

# The certificate referenced here must contain both public hostnames in its SAN.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fengxingzhicheng.com;

    ssl_certificate /etc/letsencrypt/live/fengxingzhicheng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fengxingzhicheng.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FXWEB_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    return 308 https://fengxingzhicheng.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fengxingzhicheng.com;

    ssl_certificate /etc/letsencrypt/live/fengxingzhicheng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fengxingzhicheng.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FXWEB_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 12m;

    # CSP remains application-owned. Defining a second policy here can break
    # host-relative media and makes application policy changes hard to deploy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    proxy_hide_header X-Powered-By;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Next.js build artifacts are content-addressed and safe to cache forever.
    location ^~ /_next/static/ {
        proxy_pass http://fx_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Responsive AVIF/WebP/JPEG variants generated during the build are also
    # immutable. Admin uploads under /media/uploads intentionally do not match.
    location ^~ /media/optimized/ {
        proxy_pass http://fx_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML and API responses keep the cache policy emitted by Next.js, allowing
    # dynamic/admin content to revalidate normally.
    location / {
        proxy_pass http://fx_web;
    }
}
